name: Run tests

on:
  push:
    branches: [main, review]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libxss1 libasound2 libnss3 \
            libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 \
            libxdamage1 libgconf-2-4 libgdk-pixbuf2.0-0 \
            libxrandr2 libgbm1 libpango-1.0-0 libpangocairo-1.0-0 \
            libxshmfence1 libatk-bridge2.0-0 libatspi2.0-0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run linters and format
        run: npm run test

      - name: Run Playwright tests
        run: npx playwright test
